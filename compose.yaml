services:
  didacticpancake:
    image: didacticpancake
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      otp:
        condition: service_started
    environment:
      NODE_ENV: production
      OTP_BASE_URL: http://otp:8080
      PUSH_DATA_DIR: /data
      SHARE_DATA_DIR: /share-data
      TRAFFIC_DATA_DIR: /traffic-data
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    volumes:
      - ./push-data:/data
      - ./share-data:/share-data
      - ./traffic-data:/traffic-data
    ports:
      - 3001:3000
    restart: unless-stopped

  otp:
    image: opentripplanner/opentripplanner:2.6.0
    ports:
      - '8080:8080'
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx2g
    volumes:
      - ./otp:/var/opentripplanner
    command: ['--load', '--serve']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/otp/actuators/health']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

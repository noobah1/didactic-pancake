services:
  didacticpancake:
    image: didacticpancake
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      otp:
        condition: service_started
    environment:
      NODE_ENV: production
      OTP_BASE_URL: http://otp:8080
      SHARE_DATA_DIR: /share-data
      TRAFFIC_DATA_DIR: /traffic-data
      # Optional: enables road-speed delay estimates for city bus routes
      # outside Tallinn (see README). Unset simply leaves that feature off.
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      TOMTOM_DAILY_REQUEST_BUDGET: ${TOMTOM_DAILY_REQUEST_BUDGET:-}
      # Optional: enables Tark Tee DATEX II safety-hazard alerts (slippery
      # roads, animals on road, reduced visibility, etc). Unset leaves that
      # feature off. Registration: https://tarktee.mnt.ee/#/et/datex
      DATEX_API_KEY: ${DATEX_API_KEY:-}
    volumes:
      - ./share-data:/share-data
      - ./traffic-data:/traffic-data
    ports:
      - 3001:3000
    restart: unless-stopped

  otp:
    image: opentripplanner/opentripplanner:2.6.0
    ports:
      - '8080:8080'
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx2g
    volumes:
      - ./otp:/var/opentripplanner
    command: ['--load', '--serve']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/otp/actuators/health']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

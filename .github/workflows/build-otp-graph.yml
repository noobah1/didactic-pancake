name: Build OTP graph

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily — checks the upstream feed every day
                         # (see "Check upstream GTFS feed" below) but only
                         # actually rebuilds/publishes/restarts anything on a
                         # day the feed's own ETag actually changed, so this
                         # doesn't turn into a daily no-op rebuild+redeploy.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-otp-graph

jobs:
  build-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A scheduled run only needs to rebuild when the upstream feed actually
      # changed — otherwise this would mean a full rebuild AND a ~200MB
      # download+restart on the (small, single-core) deploy server every
      # single day for no reason (see otp/sync-graph.sh, which downloads
      # whatever this workflow publishes). workflow_dispatch always forces a
      # rebuild regardless — that's the manual "I know something changed,
      # rebuild now" escape hatch, same as before this check existed.
      - name: Check upstream GTFS feed
        id: check
        run: |
          etag=$(curl -sI https://eu-gtfs.remix.com/estonia_unified_gtfs.zip | grep -i '^etag:' | tr -d '\r' | cut -d' ' -f2-)
          echo "Upstream ETag: $etag"
          previous=$(cat otp/.gtfs-etag 2>/dev/null || echo "")
          echo "Previously built: $previous"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$previous" ] || [ "$etag" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - name: Download fresh GTFS/OSM data
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -L -o otp/data/estonia_unified_gtfs.zip https://eu-gtfs.remix.com/estonia_unified_gtfs.zip
          curl -L -o otp/data/tslaevad.zip https://eu-gtfs.remix.com/tslaevad.zip
          curl -L -o otp/data/estonia-latest.osm.pbf https://download.geofabrik.de/europe/estonia-latest.osm.pbf

      - name: Build OTP graph
        if: steps.check.outputs.changed == 'true'
        run: |
          rm -f otp/graph.obj
          docker run --rm \
            -e JAVA_TOOL_OPTIONS=-Xmx6g \
            -v "$PWD/otp:/var/opentripplanner" \
            opentripplanner/opentripplanner:2.6.0 \
            --build --save

      # Published as a Release asset (overwritten each run) instead of committed to
      # git — a committed binary keeps every old version forever in LFS storage and
      # blows the free 1GB quota after a few refreshes. Release assets don't.
      - name: Publish graph to the otp-graph release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view otp-graph --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create otp-graph --repo "$GITHUB_REPOSITORY" \
              --title "OTP graph (auto-updated)" \
              --notes "Rebuilt from the upstream GTFS feed by .github/workflows/build-otp-graph.yml whenever it changes (checked daily). Latest asset is always graph.obj."
          gh release upload otp-graph otp/graph.obj --repo "$GITHUB_REPOSITORY" --clobber

      - name: Commit refreshed reference feed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.check.outputs.etag }}" > otp/.gtfs-etag
          git add otp/data/tslaevad.zip otp/.gtfs-etag
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh ferry GTFS feed + GTFS ETag marker [skip ci]"

          # main can move between checkout and push (other commits landing
          # meanwhile), which makes a plain `git push` get rejected as
          # non-fast-forward. Rebase onto the latest main and retry a few
          # times before giving up.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after multiple attempts"
          exit 1

name: Build OTP graph

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download fresh GTFS/OSM data
        run: |
          curl -L -o otp/data/estonia_unified_gtfs.zip https://eu-gtfs.remix.com/estonia_unified_gtfs.zip
          curl -L -o otp/data/tslaevad.zip https://eu-gtfs.remix.com/tslaevad.zip
          curl -L -o otp/data/estonia-latest.osm.pbf https://download.geofabrik.de/europe/estonia-latest.osm.pbf

      - name: Build OTP graph
        run: |
          rm -f otp/graph.obj
          docker run --rm \
            -e JAVA_TOOL_OPTIONS=-Xmx6g \
            -v "$PWD/otp:/var/opentripplanner" \
            opentripplanner/opentripplanner:2.6.0 \
            --build --save

      - name: Commit updated graph and reference feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add otp/graph.obj otp/data/tslaevad.zip
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh OTP graph [skip ci]"
          git push
